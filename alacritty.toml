[window]
decorations = "None"
startup_mode = "Maximized"

[font]
size = 10.00

[colors]
draw_bold_text_with_bright_colors = true
cursor = { text = "CellBackground", cursor = "#C01C28" }

# Tango color scheme
[colors.primary]
background = '#23282a'  # slightly darker than normal tango
foreground = '#d3d7cf'

[colors.normal]
black = '#2e3436'
red = '#cc0000'
green = '#4e9a06'
yellow = '#c4a000'
blue = '#3465a4'
magenta = '#75507b'
cyan = '#06989a'
white = '#d3d7cf'

[colors.bright]
black = '#555753'
red = '#ef2929'
green = '#8ae234'
yellow = '#fce94f'
blue = '#729fcf'
magenta = '#ad7fa8'
cyan = '#34e2e2'
white = '#eeeeec'
