[global]
oneshot_timeout = 500

[aliases]
# Unable to use \ in a macro directly, not sure how to escape properly but this works
backslash = \

[ids]
*

[main]
control = overload(control, esc)
capslock = overload(control, esc)

# basically homerow mods but one row below
x = lettermod(shift, x, 150, 200)
c = lettermod(meta, c, 150, 200)
v = lettermod(control, v, 150, 200)
z = lettermod(alt, z, 150, 200)

/ = lettermod(alt, /, 150, 200)
m = lettermod(control, m, 150, 200)
, = lettermod(meta, macro(,), 150, 200)
. = lettermod(shift, ., 150, 200)

leftshift = oneshot(shift)
rightshift = oneshot(shift)

space = overloadt(symbols, space, 200)
# backspace = overloadt(symbols, backspace, 200)
enter = overloadt(keypad, enter, 200)
tab = overloadt(keypad, tab, 200)

# ; = oneshotm(tap1, ;)
# ' = oneshotm(tap1, ')
# \ = oneshotm(tap1, backslash)

# I like this from readline
[control]
m = enter

# this implements something like tap-dance
# [tap1]
# ; = macro(backspace :)
# ' = macro(backspace ")
# \ = macro(backspace |)

# shift following a previous shift enables capslock
[shift]
leftshift = capslock
rightshift = capslock

[symbols]
e = [
r = ]
t = |

d = (
f = )
g = `

c = {
v = }
b = ~

y = *
u = -
i = +

h = '
j = =
k = !
; = :

n = "
m = _
, = <
. = >

1 = !
2 = @
3 = macro(#)
4 = $
5 = %
6 = ^
7 = &
8 = *
9 = (
0 = )

[keypad]
m = 1
, = 2
. = 3
j = 4
k = 5
l = 6
u = 7
i = 8
o = 9
backspace = 0
8 = =
9 = /
0 = *
p = -
; = +
/ = enter
n = _
up = .
