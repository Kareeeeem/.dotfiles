[ids]

*

[main]

# Maps capslock and capslock to escape when pressed and control when held.
control = overload(control, esc)
capslock = overload(control, esc)

# Homerow mods
# a = lettermod(alt, a, 150, 200)
# s = lettermod(shift, s, 150, 200)
# d = lettermod(meta, d, 150, 200)
# f = lettermod(control, f, 150, 200)
# j = lettermod(control, j, 150, 200)
# k = lettermod(meta, k, 150, 200)
# l = lettermod(shift, l, 150, 200)
# ; = lettermod(alt, ;, 150, 200)

# Notice we use the one-shot-shift pattern. This is important to prevent shifting errors
# caused by the necessary delay with which characters are emitted under overloadt (on
# release, instead of on press). Overload is used in lettermod.
leftshift = oneshot(shift)
rightshift = oneshot(shift)

# Symbol layer, space and backspace are both thumbkeys on the Kinesis Advantage
space = overloadt(symbols, space, 200)
backspace = overloadt(symbols, backspace, 200)

[symbols]
e = [
r = ]
t = |

d = (
f = )
g = `

c = {
v = }
b = ~

y = *
u = -
i = +

h = '
j = =
k = !

n = "
m = _
, = <
. = >

[control]
m = enter
